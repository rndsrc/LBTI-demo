<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>LBTI Assistant</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <span class="brand">◎◎ LBTI Assistant</span>
    <button type="button" id="new-chat">New chat</button>
  </header>
  <main id="chat">
    <section id="welcome">
      <h1>LBTI Assistant</h1>
      <p>Ask a question about the Large Binocular Telescope Interferometer.</p>
    </section>
    <ol id="messages"></ol>
  </main>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask about LBTI filters, overheads, nulling…" aria-label="Question" required></textarea>
    <button type="button" id="stop" hidden>Stop</button>
    <button type="submit" id="send">Send</button>
  </form>
</body>
</html>
